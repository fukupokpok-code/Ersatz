name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        # Swift 6.3 stops type-checking ContentView.body once the constraint
        # solver hits its default scope, memory, or trail budget.
        run: |
          swift build \
            -Xswiftc -Xfrontend -Xswiftc -solver-scope-threshold=8388608 \
            -Xswiftc -Xfrontend -Xswiftc -solver-memory-threshold=1073741824 \
            -Xswiftc -Xfrontend -Xswiftc -solver-trail-threshold=268435456

      - name: Analyze (write SARIF locally)
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
          upload: never
          output: codeql-results

      - name: Print findings
        if: always()
        run: |
          shopt -s nullglob
          for f in codeql-results/*.sarif; do
            echo "== $f =="
            jq -r '.runs[].results[] | "\(.level // "warning")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\t\(.message.text | split("\n")[0])"' "$f" || true
            echo "Total: $(jq '[.runs[].results[]] | length' "$f")"
          done

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/
          if-no-files-found: warn

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeql-results
          category: /language:swift
