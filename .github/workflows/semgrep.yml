name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (SARIF)
        run: |
          semgrep scan \
            --config p/swift \
            --config p/secrets \
            --config p/default \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --exclude build --exclude .build --exclude .logs || true

      - name: Semgrep scan (findings in log)
        run: |
          semgrep scan \
            --config p/swift \
            --config p/secrets \
            --config p/default \
            --metrics=off \
            --text \
            --exclude build --exclude .build --exclude .logs || true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
